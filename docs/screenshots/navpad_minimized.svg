<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad2" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#141923" />
      <stop offset="50%" stop-color="#0b0e14" />
      <stop offset="100%" stop-color="#05070a" />
    </radialGradient>

    <filter id="pillGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="0" stdDeviation="15" flood-color="#10b981" flood-opacity="0.3" />
    </filter>

    <linearGradient id="headerGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad2)" />

  <!-- Code Editor Window Mockup in the Background -->
  <g transform="translate(100, 70)" opacity="0.4">
    <rect width="1000" height="535" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="1.5" />
    <circle cx="28" cy="24" r="6" fill="#ff5f56" />
    <circle cx="48" cy="24" r="6" fill="#ffbd2e" />
    <circle cx="68" cy="24" r="6" fill="#27c93f" />
    <rect x="120" y="14" width="180" height="20" rx="6" fill="#161b22" />
    <text x="140" y="28" fill="#8b949e" font-family="'Fira Code', monospace" font-size="11">navpad.py - Visual Studio Code</text>
    
    <!-- Code lines lines -->
    <g transform="translate(40, 70)" opacity="0.6">
      <rect x="0" y="0" width="160" height="10" rx="3" fill="#ff7b72" />
      <rect x="0" y="24" width="240" height="10" rx="3" fill="#79c0ff" />
      <rect x="0" y="48" width="320" height="10" rx="3" fill="#d2a8ff" />
      <rect x="0" y="72" width="200" height="10" rx="3" fill="#a5d6ff" />
      <rect x="0" y="96" width="380" height="10" rx="3" fill="#7ee787" />
      <rect x="0" y="120" width="190" height="10" rx="3" fill="#ffa657" />
      <rect x="0" y="144" width="280" height="10" rx="3" fill="#79c0ff" />
      <rect x="0" y="168" width="350" height="10" rx="3" fill="#d2a8ff" />
      <rect x="0" y="192" width="210" height="10" rx="3" fill="#7ee787" />
      <rect x="0" y="216" width="310" height="10" rx="3" fill="#ffa657" />
    </g>
  </g>

  <!-- Title callout -->
  <g transform="translate(140, 140)">
    <rect x="0" y="0" width="130" height="28" rx="14" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4" />
    <text x="65" y="19" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">MINIMIZED MODE</text>

    <text x="0" y="80" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="40" font-weight="800">
      Assistive Touch Floating Pill
    </text>
    <text x="0" y="120" fill="url(#headerGrad2)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="700">
      Micro-Footprint, Instant Media Access
    </text>
    <text x="0" y="160" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16">
      When hidden, NavPad collapses into a translucent floating pill.
    </text>
    <text x="0" y="185" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16">
      Control previous, play/pause, next track without expanding.
    </text>
  </g>

  <!-- The Floating Pill Component itself (Centered, Floating in Foreground) -->
  <g transform="translate(460, 380)" filter="url(#pillGlow)">
    <!-- Main Capsule Body -->
    <rect x="0" y="0" width="280" height="74" rx="24" fill="#12161f" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.7" />
    
    <!-- 4 Inline Quick Buttons -->
    <!-- 1: Dot Expand Button -->
    <g transform="translate(12, 11)">
      <rect width="52" height="52" rx="16" fill="#1a2230" stroke="#334155" stroke-width="1" />
      <circle cx="26" cy="26" r="7" fill="#ffffff" />
    </g>

    <!-- 2: Left / Previous Track -->
    <g transform="translate(74, 11)">
      <rect width="52" height="52" rx="16" fill="#1a2230" stroke="#334155" stroke-width="1" />
      <path d="M 20 26 L 33 18 L 33 34 Z" fill="#ffffff" />
    </g>

    <!-- 3: Play / Pause Space -->
    <g transform="translate(136, 11)">
      <rect width="70" height="52" rx="16" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1.5" />
      <path d="M 30 18 L 44 26 L 30 34 Z" fill="#34d399" />
    </g>

    <!-- 4: Right / Next Track -->
    <g transform="translate(216, 11)">
      <rect width="52" height="52" rx="16" fill="#1a2230" stroke="#334155" stroke-width="1" />
      <path d="M 33 26 L 20 18 L 20 34 Z" fill="#ffffff" />
    </g>
  </g>

  <!-- Explanatory Pointers -->
  <g transform="translate(490, 485)">
    <text x="0" y="0" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600">▲ Tap to expand</text>
  </g>
  <g transform="translate(620, 485)">
    <text x="0" y="0" fill="#10b981" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600">▲ Play / Pause Space</text>
  </g>
  <g transform="translate(750, 485)">
    <text x="0" y="0" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600">▲ Skip / Seek</text>
  </g>
</svg>
